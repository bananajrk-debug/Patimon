<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アリ・サバイバル</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a120a; font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; }
  canvas { display: block; }
  #title {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, #5a3e1f 0%, #1a120a 75%); color: #f4e6c8; z-index: 10;
  }
  #title h1 { font-size: 64px; letter-spacing: 6px; text-shadow: 0 4px 0 #000; margin-bottom: 6px; }
  #title p.sub { opacity: .8; margin-bottom: 30px; }
  #title input {
    font-size: 22px; padding: 10px 16px; border-radius: 10px; border: 3px solid #f4e6c8; background: #2b1d0e; color: #fff;
    text-align: center; width: 260px; outline: none;
  }
  #title button {
    margin-top: 16px; font-size: 22px; padding: 12px 40px; border-radius: 10px; border: none; cursor: pointer;
    background: #e8a33a; color: #2b1d0e; font-weight: bold; box-shadow: 0 4px 0 #8a5a14;
  }
  #title button:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a5a14; }
  #title .how { margin-top: 30px; line-height: 1.9; font-size: 14px; opacity: .85; text-align: center; }
</style>
</head>
<body>
<div id="title">
  <h1>🐜 アリ・サバイバル</h1>
  <p class="sub">エサを運び、巣を守り、何日生き延びられるか</p>
  <input id="nameInput" maxlength="10" placeholder="名前を入力">
  <button id="startBtn">巣から出発</button>
  <div class="how">
    WASD / 矢印：移動　Space / クリック：かむ　E：食べる<br>
    巣の中で　Q：働きアリ誕生（食料8）　R：巣の修理（食料5）<br>
    昼はエサ集め、夜は敵が巣を襲う。朝になるとコロニーが食料を消費する。<br>
    巣の耐久が0になったらゲームオーバー。
  </div>
</div>
<canvas id="c"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const dark = document.createElement('canvas');
const dctx = dark.getContext('2d');

let VW = 0, VH = 0;
function resize() {
  VW = cv.width = dark.width = innerWidth;
  VH = cv.height = dark.height = innerHeight;
}
addEventListener('resize', resize); resize();

let world = null, myId = null, state = null, joined = false;
const R = { p: {}, e: {}, w: {} };   // 描画用（補間）
const messages = [];
const particles = [];
let gameOverInfo = null;
const cam = { x: 1500, y: 1100 };

// ---------- 通信 ----------
socket.on('init', d => { world = d; R.e = {}; R.w = {}; });
socket.on('you', id => myId = id);
socket.on('msg', t => { messages.push({ text: t, t: 5 }); if (messages.length > 5) messages.shift(); });
socket.on('gameover', d => { gameOverInfo = { ...d, t: 6 }; });
socket.on('splash', d => {
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 140;
    particles.push({ x: d.x, y: d.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.5, col: 'rgba(170,210,255,' });
  }
  particles.push({ ring: true, x: d.x, y: d.y, r: d.r, t: 0.4 });
});
socket.on('state', s => {
  state = s;
  syncList(R.p, s.p.map(p => ({ id: p.id, x: p.x, y: p.y, a: p.a, data: p })));
  syncList(R.e, s.e.map(e => ({ id: e[0], x: e[2], y: e[3], a: e[4], data: e })));
  syncList(R.w, s.w.map(w => ({ id: w[0], x: w[1], y: w[2], a: w[3], data: w })));
});
function syncList(store, list) {
  const seen = {};
  for (const o of list) {
    seen[o.id] = 1;
    let r = store[o.id];
    if (!r) r = store[o.id] = { x: o.x, y: o.y, a: o.a, phase: Math.random() * 6 };
    r.tx = o.x; r.ty = o.y; r.ta = o.a; r.data = o.data;
  }
  for (const id in store) if (!seen[id]) delete store[id];
}

// ---------- 入力 ----------
document.getElementById('startBtn').onclick = join;
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
function join() {
  const name = document.getElementById('nameInput').value.trim() || 'アリ';
  socket.emit('join', name);
  joined = true;
  document.getElementById('title').style.display = 'none';
}
const keys = {};
let lastIn = '';
function sendInput(force) {
  const dx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  const dy = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const s = dx + ',' + dy;
  if (s !== lastIn || force) { socket.emit('input', { dx, dy }); lastIn = s; }
}
addEventListener('keydown', e => {
  if (!joined) return;
  keys[e.code] = true;
  if (e.code === 'Space') { socket.emit('action', 'bite'); e.preventDefault(); }
  if (e.code === 'KeyE') socket.emit('action', 'eat');
  if (e.code === 'KeyQ') socket.emit('action', 'hatch');
  if (e.code === 'KeyR') socket.emit('action', 'repair');
  if (e.code.startsWith('Arrow')) e.preventDefault();
  sendInput();
});
addEventListener('keyup', e => { keys[e.code] = false; sendInput(); });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; sendInput(); });
cv.addEventListener('mousedown', () => { if (joined) socket.emit('action', 'bite'); });
setInterval(() => joined && sendInput(true), 500);

// ---------- 地面パターン ----------
const groundPat = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#6e4f2c'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    const v = Math.random();
    g.fillStyle = v < 0.5 ? 'rgba(40,25,10,0.25)' : v < 0.85 ? 'rgba(150,115,70,0.25)' : 'rgba(200,180,140,0.35)';
    const r = Math.random() * 2.2 + 0.4;
    g.beginPath(); g.arc(Math.random() * 256, Math.random() * 256, r, 0, 7); g.fill();
  }
  return ctx.createPattern(c, 'repeat');
})();
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }

// ---------- 描画パーツ ----------
function drawAnt(x, y, a, col, s, phase, carry, bite) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  // 影
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(-2, 3, 20, 9, 0, 0, 7); ctx.fill();
  // 脚
  ctx.strokeStyle = '#1a1008'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) for (const side of [-1, 1]) {
    const sw = Math.sin(phase + i * 2.1 + (side > 0 ? Math.PI : 0)) * 4;
    const bx = i * 4;
    ctx.beginPath(); ctx.moveTo(bx, 0);
    ctx.lineTo(bx + sw + i * 3, side * 10);
    ctx.lineTo(bx + sw + i * 7, side * 15);
    ctx.stroke();
  }
  // 腹・胸・頭
  const grd = ctx.createRadialGradient(-12, -2, 1, -11, 0, 9);
  grd.addColorStop(0, '#555'); grd.addColorStop(1, '#111');
  ctx.fillStyle = grd;
  ctx.beginPath(); ctx.ellipse(-11, 0, 8.5, 6.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#1b1b1b';
  ctx.beginPath(); ctx.ellipse(0, 0, 5, 3.5, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8, 0, 5, 4.6, 0, 0, 7); ctx.fill();
  // 目印カラー（背中の帯）
  if (col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(-11, 0, 3.5, 5.2, 0, 0, 7); ctx.fill(); }
  // 大あご
  const open = bite ? 0.7 : 0.25;
  ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 1.8;
  for (const side of [-1, 1]) {
    ctx.beginPath(); ctx.moveTo(12, side * 2);
    ctx.quadraticCurveTo(16, side * (2 + open * 6), 17, side * open * 2); ctx.stroke();
  }
  // 触角
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.2;
  for (const side of [-1, 1]) {
    const w = Math.sin(phase * 0.7 + side) * 1.5;
    ctx.beginPath(); ctx.moveTo(10, side * 2); ctx.lineTo(15, side * (7 + w)); ctx.lineTo(21, side * (9 + w)); ctx.stroke();
  }
  // 運搬物
  if (carry) {
    ctx.fillStyle = carry >= 5 ? '#fdfdf5' : '#d9b77a';
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
    const r = 3 + carry * 1.3;
    ctx.beginPath(); ctx.arc(17 + r * 0.6, 0, r, 0, 7); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawSpider(x, y, a, phase, hit) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(-4, 5, 34, 26, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = hit ? '#fff' : '#20140c'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) for (const side of [-1, 1]) {
    const sw = Math.sin(phase * 1.3 + i * 1.7 + (side > 0 ? Math.PI : 0)) * 0.15;
    const ang = side * (0.55 + i * 0.6 + sw);
    const kx = Math.cos(ang) * 20, ky = Math.sin(ang) * 20;
    const fa = ang + side * (i < 2 ? -0.35 : 0.35);
    const fx = kx + Math.cos(fa) * 18, fy = ky + Math.sin(fa) * 18;
    ctx.beginPath(); ctx.moveTo(-2, 0); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
  }
  ctx.fillStyle = hit ? '#fff' : '#2a1c12';
  ctx.beginPath(); ctx.ellipse(-12, 0, 15, 12, 0, 0, 7); ctx.fill();
  ctx.fillStyle = hit ? '#fff' : '#3b281a';
  ctx.beginPath(); ctx.ellipse(5, 0, 9, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#b8261a';
  ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(-12, -4); ctx.lineTo(-6, 0); ctx.lineTo(-12, 4); ctx.fill();
  ctx.fillStyle = '#ff5a3a';
  for (const [ex, ey] of [[11, -3], [11, 3], [9, -5], [9, 5]]) { ctx.beginPath(); ctx.arc(ex, ey, 1.4, 0, 7); ctx.fill(); }
  ctx.restore();
}

function drawBeetle(x, y, a, phase, hit) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(-2, 5, 32, 22, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#0d0d12'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) for (const side of [-1, 1]) {
    const sw = Math.sin(phase + i * 2 + (side > 0 ? Math.PI : 0)) * 4;
    ctx.beginPath(); ctx.moveTo(i * 9, side * 10); ctx.lineTo(i * 11 + sw, side * 24); ctx.stroke();
  }
  const g = ctx.createLinearGradient(0, -18, 0, 18);
  g.addColorStop(0, hit ? '#fff' : '#3f5a3a'); g.addColorStop(0.4, hit ? '#fff' : '#1f3320'); g.addColorStop(1, '#0b140c');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(-4, 0, 22, 17, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-26, 0); ctx.lineTo(14, 0); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.ellipse(-8, -8, 9, 3, -0.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#121a12';
  ctx.beginPath(); ctx.ellipse(20, 0, 7, 8, 0, 0, 7); ctx.fill();
  // 角
  ctx.strokeStyle = '#1a1a10'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(24, 0); ctx.quadraticCurveTo(34, 0, 38, -6); ctx.stroke();
  ctx.restore();
}

const FOOD_DRAW = [
  (x, y) => { ctx.fillStyle = '#d9b77a'; ctx.beginPath(); ctx.ellipse(x, y, 6, 5, (x % 3), 0, 7); ctx.fill(); ctx.fillStyle = '#b58d4f'; ctx.beginPath(); ctx.arc(x - 1, y + 1, 2, 0, 7); ctx.fill(); },
  (x, y) => { ctx.fillStyle = '#4b3a1c'; ctx.beginPath(); ctx.ellipse(x, y, 8, 5, (y % 3), 0, 7); ctx.fill(); ctx.fillStyle = '#8a6c36'; ctx.beginPath(); ctx.ellipse(x - 2, y - 1, 3, 1.5, 0, 0, 7); ctx.fill(); },
  (x, y) => { ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(x - 10, y - 8, 24, 22); ctx.fillStyle = '#fbfbf2'; ctx.fillRect(x - 12, y - 12, 24, 24); ctx.fillStyle = '#e4e4d8'; ctx.fillRect(x - 12, y + 6, 24, 6); ctx.fillStyle = '#fff'; ctx.fillRect(x - 9, y - 9, 6, 6); },
  (x, y) => { ctx.fillStyle = '#7a2e1e'; ctx.beginPath(); ctx.ellipse(x, y, 9, 6, (x % 2), 0, 7); ctx.fill(); ctx.fillStyle = '#a5503a'; ctx.beginPath(); ctx.arc(x + 2, y - 1, 3, 0, 7); ctx.fill(); },
];

function drawRock(o) {
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(o.x + 8, o.y + 10, o.r, o.r * 0.9, 0, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(o.x - o.r * 0.35, o.y - o.r * 0.4, o.r * 0.1, o.x, o.y, o.r);
  g.addColorStop(0, '#a9a49a'); g.addColorStop(0.7, '#6f6a62'); g.addColorStop(1, '#4a4640');
  ctx.fillStyle = g;
  ctx.beginPath();
  for (let i = 0; i < 12; i++) {
    const ang = i / 12 * Math.PI * 2, rr = o.r * (0.88 + hash(o.x + i, o.y) * 0.16);
    const px = o.x + Math.cos(ang) * rr, py = o.y + Math.sin(ang) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}

function drawNest(n, t) {
  // 盛り土
  const g = ctx.createRadialGradient(n.x, n.y, n.r * 0.3, n.x, n.y, n.r * 1.6);
  g.addColorStop(0, '#8b6a3e'); g.addColorStop(0.6, '#7a5a32'); g.addColorStop(1, 'rgba(110,79,44,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 1.6, 0, 7); ctx.fill();
  for (let i = 0; i < 40; i++) {
    const ang = hash(i, 3) * 7, rr = n.r * (0.6 + hash(i, 9) * 0.8);
    ctx.fillStyle = 'rgba(160,125,80,0.6)';
    ctx.beginPath(); ctx.arc(n.x + Math.cos(ang) * rr, n.y + Math.sin(ang) * rr, 2 + hash(i, 1) * 3, 0, 7); ctx.fill();
  }
  // 穴
  ctx.fillStyle = '#120a04';
  ctx.beginPath(); ctx.ellipse(n.x, n.y, n.r * 0.42, n.r * 0.32, 0, 0, 7); ctx.fill();
  // 範囲表示
  ctx.strokeStyle = 'rgba(255,230,160,' + (0.25 + Math.sin(t * 2) * 0.1) + ')';
  ctx.setLineDash([8, 8]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
}

function bar(x, y, w, h, v, col, label) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = '#333'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, v)), h);
  if (label) { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left'; ctx.fillText(label, x + 6, y + h - 4); }
}

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}
function stepSmooth(store, dt, k) {
  for (const id in store) {
    const r = store[id];
    const ox = r.x, oy = r.y;
    const f = Math.min(1, dt * k);
    r.x += (r.tx - r.x) * f; r.y += (r.ty - r.y) * f;
    r.a = lerpAngle(r.a, r.ta, f);
    r.phase += Math.hypot(r.x - ox, r.y - oy) * 0.35;
  }
}

// ---------- メインループ ----------
let last = performance.now(), T = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  stepSmooth(R.p, dt, 14); stepSmooth(R.e, dt, 10); stepSmooth(R.w, dt, 10);
  render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function render(dt) {
  ctx.fillStyle = '#1a120a'; ctx.fillRect(0, 0, VW, VH);
  if (!world || !state) return;

  const me = R.p[myId];
  if (me) { cam.x += (me.x - cam.x) * Math.min(1, dt * 8); cam.y += (me.y - cam.y) * Math.min(1, dt * 8); }
  else { cam.x = world.nest.x; cam.y = world.nest.y; }
  const ox = Math.round(VW / 2 - cam.x), oy = Math.round(VH / 2 - cam.y);
  const vx0 = cam.x - VW / 2 - 100, vy0 = cam.y - VH / 2 - 100, vx1 = cam.x + VW / 2 + 100, vy1 = cam.y + VH / 2 + 100;
  const vis = (x, y) => x > vx0 && x < vx1 && y > vy0 && y < vy1;

  ctx.save(); ctx.translate(ox, oy);
  // 地面
  ctx.fillStyle = groundPat; ctx.fillRect(0, 0, world.W, world.H);
  // 草
  const cs = 140;
  for (let gx = Math.floor(vx0 / cs); gx <= vx1 / cs; gx++) for (let gy = Math.floor(vy0 / cs); gy <= vy1 / cs; gy++) {
    if (gx < 0 || gy < 0 || gx * cs > world.W || gy * cs > world.H) continue;
    const h = hash(gx, gy);
    if (h > 0.55) {
      const x = gx * cs + hash(gy, gx) * cs, y = gy * cs + h * cs;
      ctx.strokeStyle = h > 0.8 ? '#5f7d2f' : '#4c6a26'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const sway = Math.sin(T * 1.5 + gx + i) * 3;
        ctx.beginPath(); ctx.moveTo(x + i * 4, y); ctx.quadraticCurveTo(x + i * 4 + sway, y - 15, x + i * 4 + (i - 3) * 4 + sway, y - 28 - hash(i, gx) * 14); ctx.stroke();
      }
    } else if (h < 0.12) {
      const x = gx * cs + hash(gy, gx) * cs, y = gy * cs + h * 8 * cs;
      ctx.fillStyle = '#8a8378'; ctx.beginPath(); ctx.ellipse(x, y, 5, 4, 0, 0, 7); ctx.fill();
    }
  }
  // 外周
  ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 12; ctx.strokeRect(0, 0, world.W, world.H);

  drawNest(world.nest, T);

  // 雨粒の影
  for (const d of state.r) {
    const [x, y, t, r] = d;
    if (!vis(x, y)) continue;
    ctx.fillStyle = `rgba(20,30,60,${0.15 + (1 - t) * 0.45})`;
    ctx.beginPath(); ctx.ellipse(x, y, r * (0.4 + (1 - t) * 0.6), r * 0.7 * (0.4 + (1 - t) * 0.6), 0, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(255,80,80,${0.3 + (1 - t) * 0.5})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke();
  }

  // 食べ物
  for (const f of state.f) if (vis(f[2], f[3])) FOOD_DRAW[f[1]](f[2], f[3]);

  // 働きアリ
  for (const id in R.w) { const w = R.w[id]; if (vis(w.x, w.y)) drawAnt(w.x, w.y, w.a, null, 0.75, w.phase, w.data[4] ? 1 : 0, false); }

  // 敵
  for (const id in R.e) {
    const e = R.e[id]; if (!vis(e.x, e.y)) continue;
    const [, type, , , , hpp, hit] = e.data;
    if (type === 0) drawSpider(e.x, e.y, e.a, e.phase * 0.5, hit); else drawBeetle(e.x, e.y, e.a, e.phase * 0.6, hit);
    if (hpp < 100) bar(e.x - 20, e.y - 38, 40, 4, hpp / 100, '#e74c3c');
  }

  // プレイヤー
  for (const id in R.p) {
    const p = R.p[id], d = p.data;
    if (d.d || !vis(p.x, p.y)) continue;
    drawAnt(p.x, p.y, p.a, d.col, 1.15, p.phase, d.c, d.b);
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(d.n, p.x + 1, p.y - 27);
    ctx.fillStyle = id === myId ? '#ffe9a8' : '#fff'; ctx.fillText(d.n, p.x, p.y - 28);
    bar(p.x - 18, p.y - 22, 36, 4, d.hp / 100, '#2ecc71');
  }

  // 雨（落下中のしずく）
  for (const d of state.r) {
    const [x, y, t] = d;
    if (!vis(x, y)) continue;
    const h = t * 500;
    ctx.fillStyle = 'rgba(180,215,255,0.85)';
    ctx.beginPath(); ctx.ellipse(x, y - h, 7 + (1 - t) * 6, 12 + (1 - t) * 8, 0, 0, 7); ctx.fill();
  }

  // 岩（手前に描いて潜り込み感）
  for (const o of world.rocks) if (vis(o.x, o.y) || Math.abs(o.x - cam.x) < VW / 2 + o.r && Math.abs(o.y - cam.y) < VH / 2 + o.r) drawRock(o);

  // パーティクル
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i]; q.t -= dt;
    if (q.t <= 0) { particles.splice(i, 1); continue; }
    if (q.ring) {
      ctx.strokeStyle = `rgba(190,225,255,${q.t * 2})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (1.4 - q.t), 0, 7); ctx.stroke();
    } else {
      q.x += q.vx * dt; q.y += q.vy * dt;
      ctx.fillStyle = q.col + (q.t * 2) + ')';
      ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, 7); ctx.fill();
    }
  }
  ctx.restore();

  // 夜の暗さ
  const c = state.c;
  let darkA = 0;
  if (c.night) darkA = 0.68;
  else if (c.time > world.dayLen - 15) darkA = (c.time - (world.dayLen - 15)) / 15 * 0.68;
  else if (c.time < 8 && c.day > 1) darkA = (1 - c.time / 8) * 0.68;
  if (c.rain) darkA = Math.max(darkA, 0.3);
  if (darkA > 0.01) {
    dctx.globalCompositeOperation = 'source-over';
    dctx.clearRect(0, 0, VW, VH);
    dctx.fillStyle = c.rain && !c.night ? `rgba(20,30,50,${darkA})` : `rgba(5,5,25,${darkA})`;
    dctx.fillRect(0, 0, VW, VH);
    dctx.globalCompositeOperation = 'destination-out';
    const light = (x, y, r) => {
      const g = dctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, 7); dctx.fill();
    };
    for (const id in R.p) { const p = R.p[id]; if (!p.data.d) light(p.x + ox, p.y + oy, id === myId ? 260 : 160); }
    light(world.nest.x + ox, world.nest.y + oy, 200);
    ctx.drawImage(dark, 0, 0);
  }
  if (c.rain) {
    ctx.strokeStyle = 'rgba(180,210,255,0.35)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 120; i++) {
      const x = (hash(i, 1) * VW + T * 200) % VW, y = (hash(i, 2) * VH + T * 900 * (0.7 + hash(i, 3) * 0.6)) % VH;
      ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 16);
    }
    ctx.stroke();
  }

  drawHUD(c, me, ox, oy, dt);
}

function drawHUD(c, me, ox, oy, dt) {
  const my = state.p.find(p => p.id === myId);
  ctx.textBaseline = 'alphabetic';

  // 左上：自分
  if (my) {
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(10, 10, 230, 88);
    bar(20, 20, 210, 18, my.hp / 100, '#2ecc71', `HP ${my.hp}`);
    bar(20, 44, 210, 18, my.hu / 100, my.hu < 25 ? '#e67e22' : '#f1c40f', `満腹 ${my.hu}${my.hu < 25 ? '  ⚠ 腹ぺこ' : ''}`);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`運搬 ${my.c}/5　　貢献 ${my.s}`, 20, 86);
  }

  // 中央上：日付
  const total = c.night ? world.nightLen : world.dayLen;
  const remain = Math.max(0, Math.ceil(total - c.time));
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(VW / 2 - 130, 10, 260, 52);
  ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = c.night ? '#a9b8ff' : '#ffe08a';
  ctx.fillText(`${c.night ? '🌙' : c.rain ? '☔' : '☀'} ${c.day}日目 ${c.night ? '夜' : '昼'}`, VW / 2, 36);
  ctx.font = '13px sans-serif'; ctx.fillStyle = '#ddd';
  ctx.fillText(c.night ? `夜明けまで ${remain}秒` : `日没まで ${remain}秒`, VW / 2, 54);

  // 右上：コロニー
  const rx = VW - 250;
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(rx, 10, 240, 100);
  ctx.textAlign = 'left'; ctx.font = 'bold 15px sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(`🏠 コロニー`, rx + 10, 30);
  bar(rx + 10, 38, 220, 16, c.nh / c.mnh, c.nh < 30 ? '#e74c3c' : '#c0874a', `巣の耐久 ${c.nh}/${c.mnh}`);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#fff';
  const need = state.p.length * 2 + c.wk;
  ctx.fillText(`食料 ${c.food}（朝に${need}消費）`, rx + 10, 76);
  ctx.fillText(`働きアリ ${c.wk}匹　最高記録 ${c.best}日`, rx + 10, 98);

  // 巣への矢印
  if (me && my && !my.d) {
    const nx = world.nest.x + ox, ny = world.nest.y + oy;
    if (nx < 0 || nx > VW || ny < 0 || ny > VH) {
      const a = Math.atan2(ny - VH / 2, nx - VW / 2);
      const ax = VW / 2 + Math.cos(a) * Math.min(VW, VH) * 0.42, ay = VH / 2 + Math.sin(a) * Math.min(VW, VH) * 0.42;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
      ctx.fillStyle = 'rgba(255,220,120,0.85)';
      ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-10, -11); ctx.lineTo(-4, 0); ctx.lineTo(-10, 11); ctx.fill();
      ctx.restore();
      ctx.fillStyle = 'rgba(255,220,120,0.9)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('巣', ax, ay - 16);
    }
  }

  // 巣にいる時のヒント
  if (me && my && !my.d && Math.hypot(me.x - world.nest.x, me.y - world.nest.y) < world.nest.r) {
    ctx.textAlign = 'center'; ctx.font = 'bold 15px sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(VW / 2 - 260, VH - 110, 520, 30);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillText('巣の中：E 食べる ／ Q 働きアリ誕生(8) ／ R 巣を修理(5)', VW / 2, VH - 90);
  }

  // 下：操作
  ctx.textAlign = 'center'; ctx.font = '13px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fillText('WASD：移動　Space/クリック：かむ　E：食べる　Q：働きアリ　R：巣の修理', VW / 2, VH - 60);

  // ミニマップ
  const mw = 180, mh = mw * world.H / world.W, mx = VW - mw - 12, my2 = VH - mh - 12, s = mw / world.W;
  ctx.fillStyle = 'rgba(30,20,10,0.75)'; ctx.fillRect(mx - 3, my2 - 3, mw + 6, mh + 6);
  ctx.fillStyle = '#5a4126'; ctx.fillRect(mx, my2, mw, mh);
  ctx.fillStyle = '#888';
  for (const o of world.rocks) { ctx.beginPath(); ctx.arc(mx + o.x * s, my2 + o.y * s, Math.max(1.5, o.r * s), 0, 7); ctx.fill(); }
  ctx.fillStyle = '#f5d48a'; ctx.beginPath(); ctx.arc(mx + world.nest.x * s, my2 + world.nest.y * s, 5, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(230,200,140,0.6)';
  for (const f of state.f) ctx.fillRect(mx + f[2] * s, my2 + f[3] * s, 1.5, 1.5);
  ctx.fillStyle = '#ddd';
  for (const w of state.w) ctx.fillRect(mx + w[1] * s - 1, my2 + w[2] * s - 1, 2, 2);
  ctx.fillStyle = '#ff4b3a';
  for (const e of state.e) ctx.fillRect(mx + e[2] * s - 1.5, my2 + e[3] * s - 1.5, 3, 3);
  for (const p of state.p) {
    if (p.d) continue;
    ctx.fillStyle = p.id === myId ? '#fff' : p.col;
    ctx.beginPath(); ctx.arc(mx + p.x * s, my2 + p.y * s, p.id === myId ? 3.5 : 2.5, 0, 7); ctx.fill();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(mx + (cam.x - VW / 2) * s, my2 + (cam.y - VH / 2) * s, VW * s, VH * s);

  // メッセージ
  ctx.textAlign = 'center'; ctx.font = 'bold 17px sans-serif';
  let yy = 95;
  for (let i = messages.length - 1; i >= 0; i--) {
    const m = messages[i]; m.t -= dt;
    if (m.t <= 0) { messages.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, m.t);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(m.text, VW / 2 + 1, yy + 1);
    ctx.fillStyle = '#fff'; ctx.fillText(m.text, VW / 2, yy);
    yy += 24;
  }
  ctx.globalAlpha = 1;

  // 死亡
  if (my && my.d) {
    ctx.fillStyle = 'rgba(60,0,0,0.45)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('やられた…', VW / 2, VH / 2 - 10);
    ctx.font = '20px sans-serif'; ctx.fillText(`${my.rs}秒後に巣で復活`, VW / 2, VH / 2 + 30);
  }

  // ゲームオーバー
  if (gameOverInfo) {
    gameOverInfo.t -= dt;
    if (gameOverInfo.t <= 0) gameOverInfo = null;
    else {
      ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(0, 0, VW, VH);
      ctx.textAlign = 'center'; ctx.fillStyle = '#ff7a5a'; ctx.font = 'bold 54px sans-serif';
      ctx.fillText('コロニー壊滅', VW / 2, VH / 2 - 30);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 26px sans-serif';
      ctx.fillText(`${gameOverInfo.day}日目まで生き延びた（最高 ${gameOverInfo.best}日）`, VW / 2, VH / 2 + 20);
      ctx.font = '18px sans-serif'; ctx.fillStyle = '#ccc';
      ctx.fillText('まもなく新しいコロニーで再スタート…', VW / 2, VH / 2 + 60);
    }
  }
}
</script>
