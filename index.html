<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ANT SURVIVAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e0a06; font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; color: #eee; user-select: none; }
  canvas { display: block; touch-action: none; }
  body { touch-action: manipulation; -webkit-touch-callout: none; -webkit-user-select: none; }
  #dropBtn { margin-top: 10px; padding: 8px 16px; border: none; border-radius: 5px; background: #8a3a2a; color: #fff; font-weight: bold; font-family: inherit; cursor: pointer; }
  .hidden { display: none !important; }
  #lobby {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #3b2a17 0%, #120c07 70%);
  }
  #lobby .box { width: 420px; text-align: center; }
  #lobby h1 { font-size: 46px; letter-spacing: 8px; color: #f0d9a8; text-shadow: 0 4px 0 #000, 0 0 30px rgba(240,200,120,.25); }
  #lobby .sub { color: #b9a685; margin: 6px 0 34px; letter-spacing: 2px; }
  #lobby input {
    width: 100%; font-size: 20px; padding: 11px 14px; border-radius: 6px; border: 2px solid #6b5636; background: #1d140b; color: #fff;
    text-align: center; outline: none; margin-bottom: 12px; font-family: inherit;
  }
  #lobby input:focus { border-color: #e2b45c; }
  #lobby button {
    width: 100%; font-size: 19px; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-family: inherit;
    background: #d79b3b; color: #1d140b; box-shadow: 0 4px 0 #7a5418; margin-bottom: 12px;
  }
  #lobby button.sec { background: #4b3a24; color: #f0d9a8; box-shadow: 0 4px 0 #24190d; }
  #lobby button:active { transform: translateY(3px); box-shadow: none; }
  #lobby .row { display: flex; gap: 10px; } #lobby .row > * { flex: 1; }
  #lobby .or { color: #7d6a4c; margin: 6px 0 14px; font-size: 13px; }
  #err { color: #ff8a7a; min-height: 22px; margin-top: 4px; }
  #lobby .keys { margin-top: 22px; font-size: 12px; line-height: 1.9; color: #a08f72; }
  #lobby { overflow-y: auto; align-items: flex-start; padding: 40px 0; }
  #lobby .box { width: min(460px, 92vw); margin: auto; }
  #lobby .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  #lobby .tabs button { flex: 1; margin: 0; background: #2b1f12; color: #b9a685; box-shadow: none; font-size: 15px; padding: 10px; }
  #lobby .tabs button.on { background: #4b3a24; color: #f0d9a8; }
  #lobby .note { font-size: 12px; color: #8f7d60; line-height: 1.7; }
  #lobby .hello { color: #e8d8b8; margin-bottom: 8px; }
  #lobby h3 { text-align: left; color: #f0d9a8; font-size: 15px; margin: 18px 0 8px; border-bottom: 1px solid #4b3a24; padding-bottom: 4px; }
  #lobby h3 span { color: #8f7d60; font-weight: normal; font-size: 12px; }
  #lobby button.small { width: auto; flex: 0 0 90px; height: 48px; margin: 0; }
  #lobby button.mini { width: auto; padding: 4px 10px; font-size: 12px; margin: 0 0 0 8px; background: #3a2a18; color: #c8b796; box-shadow: none; }
  #lobby button.mini.red { background: #6a2a20; color: #fbb; }
  #lobby .wrow, #lobby .frow { display: flex; align-items: center; gap: 8px; background: #22180e; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; text-align: left; }
  #lobby .wrow > div, #lobby .frow > div { flex: 1; min-width: 0; }
  #lobby .wrow small, #lobby .frow small { display: block; color: #8f7d60; font-size: 11px; }
  #lobby .wrow button { width: auto; margin: 0; padding: 7px 16px; font-size: 14px; }
  #lobby .frow .fw { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  #lobby .frow .fw button { width: auto; margin: 0; padding: 5px 10px; font-size: 12px; box-shadow: none; }
  #lobby .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #555; }
  #lobby .dot.on { background: #4fd36a; }
  #lobby .empty { color: #7d6a4c; font-size: 13px; padding: 6px; }
  #lobby .inc { background: #2e2a12; border: 1px solid #6b5a2a; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; text-align: left; display: flex; align-items: center; }
  #lobby .inc span { flex: 1; }
  #lobby .row input { margin-bottom: 0; }
  #lobby .row { margin-bottom: 8px; }
  #err.ok { color: #9be39b; }
  #leaveBtn { position: fixed; right: 12px; top: 214px; z-index: 5; padding: 6px 12px; border: 1px solid #6b5636; border-radius: 5px; background: rgba(24,17,10,.85); color: #e8d8b8; font-family: inherit; font-size: 12px; cursor: pointer; }

  #panel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -54%); z-index: 10;
    background: rgba(24,17,10,.96); border: 2px solid #6b5636; border-radius: 8px; padding: 16px 18px; min-width: 470px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #panel h2 { font-size: 17px; color: #f0d9a8; margin-bottom: 10px; display: flex; justify-content: space-between; }
  #panel h2 small { color: #8f7d60; font-weight: normal; font-size: 12px; }
  #panel h3 { font-size: 13px; color: #b9a685; margin: 10px 0 6px; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(8, 52px); gap: 5px; }
  .slot {
    width: 52px; height: 52px; background: #2b2014; border: 2px solid #4b3a24; border-radius: 5px; position: relative; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .slot:hover { border-color: #b08a4e; }
  .slot.sel { border-color: #f0d9a8; }
  .slot.held { border-color: #6fd36f; background: #2e3a20; }
  .slot img { width: 40px; height: 40px; pointer-events: none; }
  .slot span { position: absolute; right: 3px; bottom: 1px; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }
  .recipes { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
  .rc { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; background: #22180e; margin-bottom: 5px; }
  .rc img { width: 36px; height: 36px; }
  .rc .nm { width: 130px; font-size: 14px; }
  .rc .nm small { display: block; color: #e2a35c; font-size: 11px; }
  .rc .cost { flex: 1; font-size: 12px; color: #c8b796; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .rc .cost .ng { color: #d36b5c; }
  .rc .cost img { width: 18px; height: 18px; vertical-align: middle; }
  .rc button { padding: 6px 14px; border: none; border-radius: 4px; background: #d79b3b; color: #1d140b; font-weight: bold; cursor: pointer; font-family: inherit; }
  .rc button:disabled { background: #4b3a24; color: #7d6a4c; cursor: default; }
  .phint { margin-top: 10px; font-size: 12px; color: #8f7d60; }
  .invwrap { display: flex; gap: 18px; align-items: flex-start; }
  .eqbox { width: 150px; background: #22180e; border-radius: 6px; padding: 10px; text-align: center; }
  .eqbox .eqrow { display: flex; align-items: center; gap: 8px; margin: 8px 0; text-align: left; font-size: 12px; color: #c8b796; }
  .eqbox .slot.eq { border-color: #8a6a3a; background: #33261a; }
  .eqbox .stats { font-size: 12px; line-height: 1.8; color: #e8d8b8; text-align: left; margin-top: 8px; border-top: 1px solid #4b3a24; padding-top: 6px; }
  #panel .btns button { margin: 10px 8px 0 0; padding: 8px 16px; border: none; border-radius: 5px; font-weight: bold; font-family: inherit; cursor: pointer; }
  #story { position: fixed; inset: 0; z-index: 15; display: flex; align-items: center; justify-content: center; background: rgba(5,3,1,.88); }
  #story .box { width: min(560px, 90vw); text-align: center; color: #f0e2c4; line-height: 2; font-size: 17px; }
  #story h2 { font-size: 30px; color: #f2c46a; margin-bottom: 18px; letter-spacing: 4px; }
  #story button { margin-top: 26px; font-size: 18px; padding: 12px 40px; border: none; border-radius: 6px; background: #d79b3b; color: #1d140b; font-weight: bold; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div id="lobby">
  <div class="box">
    <h1>ANT SURVIVAL</h1>
    <div class="sub">掘れ。運べ。夜を越えろ。</div>
    <div id="authView">
      <div class="tabs"><button data-tab="reg" class="on">はじめて遊ぶ</button><button data-tab="login">アカウント復元</button></div>
      <input id="uName" maxlength="12" placeholder="ユーザーネーム（2〜12文字）" autocomplete="username">
      <input id="uPass" type="password" maxlength="64" placeholder="パスワード（4文字以上）" autocomplete="current-password">
      <button id="authBtn">アカウントを作る</button>
      <div class="note" id="authNote">ユーザーネームとパスワードを覚えておけば、別の端末でもアカウントを復元できます。</div>
    </div>
    <div id="homeView" class="hidden">
      <div class="hello">ようこそ <b id="hName"></b> さん <button id="logoutBtn" class="mini">ログアウト</button></div>
      <h3>自分のワールド <span id="wCount"></span></h3>
      <div id="myWorlds"></div>
      <div class="row" id="createRow"><input id="wName" maxlength="16" placeholder="新しいワールドの名前"><button id="createBtn" class="small">作る</button></div>
      <h3>フレンド</h3>
      <div class="row"><input id="fName" maxlength="12" placeholder="ユーザーネームを入れて追加"><button id="addFriendBtn" class="small sec">追加</button></div>
      <div id="incoming"></div>
      <div id="friends"></div>
    </div>
    <div id="err"></div>
    <div class="keys">
      WASD 移動 ／ 左クリック長押し・K 掘る・攻撃 ／ 右クリック・O 置く ／ E 調べる・使う<br>
      1〜8・ホイール 持ち替え ／ Tab 持ち物・装備 ／ C クラフト ／ F 巣に出入り ／ Q 捨てる
    </div>
  </div>
</div>
<button id="leaveBtn" class="hidden">🏠 ロビーへ</button>
<canvas id="c"></canvas>
<div id="story" class="hidden"><div class="box">
  <h2>👑 消えた女王</h2>
  嵐の夜、巨大なクモが巣を襲い、<br>女王アリを連れ去った。<br><br>
  巣の奥には、まだ女王の匂いが残っている。<br>
  匂いをたどり、女王を取り戻せ。
  <br><button id="storyBtn">匂いをたどる</button>
</div></div>
<div id="panel" class="hidden"><h2 id="ptitle"></h2><div id="pbody"></div><div class="phint" id="phint"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const socket = io();
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
const Z = 2;   // 表示倍率
let VW = 0, VH = 0;
function resize() { VW = cv.width = dark.width = innerWidth; VH = cv.height = dark.height = innerHeight; }
addEventListener('resize', resize); resize();

// ================= 状態 =================
let D = null, MEID = null, CODE = '', WORLD_NAME = '';
const me = { l: 'u', x: 0, y: 0, a: 0, s: 1, phase: 0 };
let inv = [], sel = 0, under = null, rocks = [], dens = [], trees = [], deco = [];
let touchMode = false, joy = null, wt = null, wakeT = 0;
const objs = { s: new Map(), u: new Map() }, items = new Map();
let grass = new Map(), st = null, cracks = new Map();
const RP = {}, RE = {};
const msgs = [], parts = [];
let gameover = null, panel = null, chest = null, held = -1, shake = 0;
let equip = { jaw: null, armor: null }, lair = null, clearInfo = null, webs = [], questFlash = 0;
const mouse = { x: 0, y: 0, l: false };
const keys = {};
const mm = document.createElement('canvas'); let mmDirty = true;

// ================= ロビー（アカウント・ワールド・フレンド） =================
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let authTab = 'reg', loggedName = null, lobbyTimer = null;
function showErr(t, ok) { $('err').textContent = t || ''; $('err').className = ok ? 'ok' : ''; }
function getAuth() { try { return JSON.parse(localStorage.getItem('antAuth') || 'null'); } catch (e) { return null; } }
function setAuth(v) { try { v ? localStorage.setItem('antAuth', JSON.stringify(v)) : localStorage.removeItem('antAuth'); } catch (e) {} }
document.querySelectorAll('#lobby .tabs button').forEach(b => b.onclick = () => {
  authTab = b.dataset.tab;
  document.querySelectorAll('#lobby .tabs button').forEach(x => x.classList.toggle('on', x === b));
  $('authBtn').textContent = authTab === 'reg' ? 'アカウントを作る' : 'アカウントを復元する';
  $('authNote').textContent = authTab === 'reg' ? 'ユーザーネームとパスワードを覚えておけば、別の端末でもアカウントを復元できます。' : '前に作ったユーザーネームとパスワードを入れてください。';
  showErr('');
});
function doAuth() {
  const name = $('uName').value.trim(), pass = $('uPass').value;
  showErr('…');
  socket.emit(authTab === 'reg' ? 'register' : 'login', { name, pass });
}
$('authBtn').onclick = doAuth;
$('uPass').addEventListener('keydown', e => { if (e.key === 'Enter') doAuth(); });
$('logoutBtn').onclick = () => {
  const a = getAuth();
  socket.emit('logout', { token: a && a.token });
  setAuth(null); loggedName = null; showLobby('auth');
};
$('createBtn').onclick = () => { socket.emit('createWorld', { name: $('wName').value.trim() }); $('wName').value = ''; };
$('addFriendBtn').onclick = () => { const n = $('fName').value.trim(); if (n) socket.emit('addFriend', { name: n }); $('fName').value = ''; };
$('fName').addEventListener('keydown', e => { if (e.key === 'Enter') $('addFriendBtn').onclick(); });
$('lobby').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.play) { showErr('ワールドを読み込み中…', true); socket.emit('join', { code: b.dataset.play }); }
  if (b.dataset.del && confirm(`「${b.dataset.name}」を削除しますか？\n元に戻せません。`)) socket.emit('deleteWorld', { code: b.dataset.del });
  if (b.dataset.unfriend && confirm(`${b.dataset.unfriend} をフレンドから外しますか？`)) socket.emit('removeFriend', { name: b.dataset.unfriend });
  if (b.dataset.addback) socket.emit('addFriend', { name: b.dataset.addback });
});
$('leaveBtn').onclick = () => { socket.emit('leave'); exitGame(); };
function showLobby(view) {
  $('lobby').classList.remove('hidden'); $('leaveBtn').classList.add('hidden');
  $('authView').classList.toggle('hidden', view !== 'auth');
  $('homeView').classList.toggle('hidden', view !== 'home');
  clearInterval(lobbyTimer);
  if (view === 'home') lobbyTimer = setInterval(() => socket.emit('lobby'), 5000);
}
function exitGame() { D = null; closePanel(); touchMode = false; joy = null; wt = null; mouse.l = false; showLobby(loggedName ? 'home' : 'auth'); if (loggedName) socket.emit('lobby'); }
socket.on('connect', () => {
  if (D) { D = null; closePanel(); }
  const a = getAuth();
  if (a && a.token) { showErr('ログイン中…', true); socket.emit('auth', a); } else showLobby('auth');
});
socket.on('authFail', () => { setAuth(null); showErr(''); showLobby('auth'); });
socket.on('authErr', t => showErr(t));
socket.on('loggedIn', d => {
  loggedName = d.name;
  if (d.token) setAuth({ name: d.name, token: d.token });
  $('hName').textContent = d.name; $('uPass').value = '';
  showErr(''); if (!D) showLobby('home');
});
socket.on('kicked', t => { exitGame(); showErr(t); });
socket.on('err', t => showErr(t));
socket.on('info', t => showErr(t, true));
socket.on('lobby', d => {
  $('wCount').textContent = `（${d.worlds.length}/${d.max}）`;
  $('createRow').classList.toggle('hidden', d.worlds.length >= d.max);
  $('myWorlds').innerHTML = d.worlds.map(w => `<div class="wrow"><div><b>${esc(w.name)}</b><small>${w.players ? `🐜 ${w.players}人が遊んでいる` : 'だれもいない'}</small></div><button data-play="${esc(w.code)}">遊ぶ</button><button class="mini red" data-del="${esc(w.code)}" data-name="${esc(w.name)}">削除</button></div>`).join('')
    || '<div class="empty">まだワールドがありません。名前を入れて「作る」を押してね</div>';
  $('incoming').innerHTML = d.incoming.map(n => `<div class="inc"><span>📩 <b>${esc(n)}</b> があなたをフレンドに追加しました</span><button class="mini" data-addback="${esc(n)}">追加し返す</button></div>`).join('');
  $('friends').innerHTML = d.friends.map(f => `<div class="frow"><div>
      <span class="dot ${f.online ? 'on' : ''}"></span><b>${esc(f.name)}</b>
      <small>${f.mutual ? (f.online ? (f.inWorld ? `「${esc(f.inWorld)}」で遊んでいる` : 'オンライン') : 'オフライン') : '相手が追加してくれるのを待っています'}</small>
      ${f.mutual ? `<div class="fw">${f.worlds.map(w => `<button class="sec" data-play="${esc(w.code)}">${esc(w.name)}${w.players ? ` 🐜${w.players}` : ''} に参加</button>`).join('') || '<small>ワールドがまだない</small>'}</div>` : ''}
    </div><button class="mini red" data-unfriend="${esc(f.name)}">外す</button></div>`).join('')
    || '<div class="empty">ユーザーネームを入れるとフレンドを追加できます。お互いに追加し合うと、相手のワールドに参加できます</div>';
});

// ================= 受信 =================
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
socket.on('world', d => {
  D = d.defs; MEID = d.me; CODE = d.code;
  rocks = d.rocks; dens = d.dens; trees = d.trees || []; deco = d.deco || []; grass = new Map(d.grass); under = b64(d.under);
  objs.s = new Map(d.objs.s.map(([i, t, hp, a]) => [i, { t, hp, a }]));
  objs.u = new Map(d.objs.u.map(([i, t, hp, a]) => [i, { t, hp, a }]));
  items.clear(); for (const it of d.items) addItemC(it);
  Object.assign(me, { l: d.you.l, x: d.you.x, y: d.you.y, s: d.you.s });
  inv = d.inv; sel = d.sel; equip = d.equip || { jaw: null, armor: null }; lair = d.lair; mmDirty = true; gameover = null; closePanel();
  try { if (d.quest.stage === 0 && !localStorage.getItem('story_' + d.code)) $('story').classList.remove('hidden'); } catch (e) {}
  $('lobby').classList.add('hidden'); $('leaveBtn').classList.remove('hidden'); clearInterval(lobbyTimer); showErr('');
  WORLD_NAME = d.worldName || '';
  for (const k in RP) delete RP[k];
  for (const k in RE) delete RE[k];
});
function addItemC(a) { items.set(a[0], { id: a[0], l: a[1] ? 'u' : 's', x: a[2], y: a[3], item: a[4], n: a[5] }); }
socket.on('item+', addItemC);
socket.on('item-', id => items.delete(id));
socket.on('tp', d => { Object.assign(me, { s: d.s, l: d.l, x: d.x, y: d.y }); if (panel === 'chest') closePanel(); });
socket.on('inv', d => { inv = d.inv; sel = d.sel; equip = d.equip || equip; if (panel) renderPanel(); });
socket.on('web', ([x1, y1, x2, y2]) => webs.push({ x1, y1, x2, y2, life: 0.7 }));
socket.on('questUp', () => questFlash = 2.5);
socket.on('clear', d => clearInfo = { day: d.day, t: 10 });
$('storyBtn').onclick = () => { $('story').classList.add('hidden'); try { localStorage.setItem('story_' + CODE, 1); } catch (e) {} };
socket.on('tiles', list => { for (const [i, v] of list) under[i] = v; mmDirty = true; });
socket.on('grass', list => { for (const [i, g] of list) grass.set(i, g); });
socket.on('objs', list => { for (const { l, i, o } of list) { if (o) objs[l].set(i, o); else objs[l].delete(i); } mmDirty = true; });
socket.on('chest', d => {
  if (d.update && !(panel === 'chest' && chest && chest.l === d.l && chest.i === d.i)) return;
  chest = d; openPanel('chest');
});
socket.on('openCraft', () => openPanel('craft'));
socket.on('msg', t => { msgs.push({ t, life: 6 }); if (msgs.length > 6) msgs.shift(); });
socket.on('gameover', d => gameover = { day: d.day, t: 7 });
socket.on('collapse', list => {
  for (const i of list) {
    const tx = i % D.UW, ty = (i / D.UW) | 0;
    for (let k = 0; k < 10; k++) parts.push({ l: 'u', x: (tx + Math.random()) * D.T, y: (ty + Math.random()) * D.T, vx: (Math.random() - .5) * 80, vy: (Math.random() - .5) * 80, life: .8, col: '120,95,70', r: 2 + Math.random() * 3 });
    if (me.l === 'u' && Math.hypot((tx + .5) * D.T - me.x, (ty + .5) * D.T - me.y) < 400) shake = 0.5;
  }
});
socket.on('st', s => {
  st = s;
  cracks = new Map(s.k);
  sync(RP, s.p.filter(p => p[0] !== MEID).map(p => ({ id: p[0], x: p[4], y: p[5], a: p[6], d: p })));
  sync(RE, s.e.map(e => ({ id: e[0], x: e[3], y: e[4], a: e[5], d: e })));
});
function sync(store, list) {
  const seen = {};
  for (const o of list) {

        ctx.save(); ctx.translate(ax, ay); ctx.rotate(a); ctx.fillStyle = 'rgba(255,140,200,.9)';
        ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-8, -9); ctx.lineTo(-3, 0); ctx.lineTo(-8, 9); ctx.fill(); ctx.restore();
        ctx.fillStyle = 'rgba(255,170,215,.95)'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(`女王の匂い ${dm}m`, ax, ay - 15);
      }
    }
    // 巨大グモの体力
    for (const id in RE) {
      const e = RE[id];
      if (e.d[1] !== 2 || (e.d[2] ? 'u' : 's') !== me.l || Math.hypot(e.x - me.x, e.y - me.y) > 700) continue;
      ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(VW / 2 - 202, 68, 404, 22);
      ctx.fillStyle = '#5a2a6a'; ctx.fillRect(VW / 2 - 200, 70, 400, 18);
      ctx.fillStyle = '#c04ad8'; ctx.fillRect(VW / 2 - 200, 70, 400 * e.d[6] / 100, 18);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🕷 巨大グモ', VW / 2, 84);
    }
  }
  if (ms && ms[17]) { ctx.fillStyle = 'rgba(230,230,240,.12)'; ctx.fillRect(0, 0, VW, VH); ctx.fillStyle = '#eef'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('クモの糸で動きが鈍い！', VW / 2, VH / 2 + 60); }
  if (clearInfo) {
    clearInfo.t -= dt;
    if (clearInfo.t <= 0) clearInfo = null;
    else {
      const al = Math.min(1, clearInfo.t / 1.5, (10 - clearInfo.t) * 2);
      ctx.globalAlpha = al; ctx.fillStyle = 'rgba(30,18,4,.75)'; ctx.fillRect(0, VH / 2 - 90, VW, 180);
      ctx.textAlign = 'center'; ctx.fillStyle = '#ffd75a'; ctx.font = 'bold 46px sans-serif'; ctx.fillText('👑 女王救出！', VW / 2, VH / 2 - 15);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.fillText(`${clearInfo.day}日目でクリア　―　このワールドで遊び続けられます`, VW / 2, VH / 2 + 30);
      ctx.globalAlpha = 1;
    }
  }
  // 中央上
  const total = night ? D.NIGHT_LEN : D.DAY_LEN, remain = Math.max(0, Math.ceil(total - time));
  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(VW / 2 - 120, 10, 240, 50);
  ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = night ? '#a9b8ff' : '#ffe08a';
  ctx.fillText(`${night ? '🌙' : rain ? '☔' : '☀'} ${day}日目　${me.l === 'u' ? '巣の中' : '地上'}`, VW / 2, 34);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#ccc';
  ctx.fillText(night ? `夜明けまで ${remain}秒` : `日没まで ${remain}秒`, VW / 2, 52);
  // 右上：ミニマップ
  const mw = 210, mh = 158, mx = VW - mw - 12, my = 12;
  ctx.fillStyle = 'rgba(20,14,8,.85)'; ctx.fillRect(mx - 3, my - 3, mw + 6, mh + 24);
  ctx.save(); ctx.beginPath(); ctx.rect(mx, my, mw, mh); ctx.clip();
  if (me.l === 'u') {
    if (mmDirty) rebuildMinimap();
    const sc = 3, cx = me.x / D.T, cy = me.y / D.T;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(mm, mx + mw / 2 - cx * sc, my + mh / 2 - cy * sc, D.UW * sc, D.UH * sc);
    ctx.imageSmoothingEnabled = true;
    for (const [i, o] of objs.u) { ctx.fillStyle = o.t === 'chest' ? '#e2b45c' : o.t === 'bench' ? '#c88' : D.OBJ[o.t].support ? '#7cf' : '#aaa'; ctx.fillRect(mx + mw / 2 + ((i % D.UW) - cx) * sc, my + mh / 2 + ((i / D.UW | 0) - cy) * sc, sc, sc); }
    const pt = (x, y, c, r) => circ(ctx, mx + mw / 2 + (x / D.T - cx) * sc, my + mh / 2 + (y / D.T - cy) * sc, r, c);
    for (const id in RE) if (RE[id].d[2]) pt(RE[id].x, RE[id].y, '#ff4b3a', 2);
    for (const id in RP) if (RP[id].d[3] && !RP[id].d[9]) pt(RP[id].x, RP[id].y, RP[id].d[2], 2.5);
    pt(me.x, me.y, '#fff', 3);
  } else {
    const s = mw / (D.SW * D.T);
    ctx.fillStyle = '#5a4126'; ctx.fillRect(mx, my, mw, mh);
    ctx.fillStyle = '#8a8478'; for (const o of rocks) { ctx.beginPath(); ctx.arc(mx + o.x * s, my + o.y * s, Math.max(1, o.r * s), 0, 7); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    for (const r of [30, 62]) { ctx.beginPath(); ctx.arc(mx + D.NEST.x * s, my + D.NEST.y * s, r * D.T * s, 0, 7); ctx.stroke(); }
    for (const t of trees) { circ(ctx, mx + t.x * s, my + t.y * s, 22 * 1.0, 'rgba(30,60,20,.45)'); circ(ctx, mx + t.x * s, my + t.y * s, 3.5, '#3a2a16'); }
    for (const d of deco) if (d.t !== 'flower') circ(ctx, mx + d.x * s, my + d.y * s, 2, d.t === 'cap' ? '#d33' : d.t === 'can' ? '#ccd' : '#a65');
    for (const d of dens) circ(ctx, mx + d.x * s, my + d.y * s, 2.5, '#300');
    for (const [i, o] of objs.s) if (o.t === 'branch') { ctx.fillStyle = '#e0a050'; ctx.fillRect(mx + (i % D.SW) * D.T * s - 1, my + (i / D.SW | 0) * D.T * s - 1, 2.5, 2.5); }
    for (const [i, o] of objs.s) if (o.t === 'sugarNode') { ctx.fillStyle = '#fff'; ctx.fillRect(mx + (i % D.SW) * D.T * s - 1, my + (i / D.SW | 0) * D.T * s - 1, 2.5, 2.5); }
    circ(ctx, mx + D.NEST.x * s, my + D.NEST.y * s, 4, '#f5d48a');
    for (const id in RE) if (!RE[id].d[2]) circ(ctx, mx + RE[id].x * s, my + RE[id].y * s, 1.5, '#ff4b3a');
    for (const id in RP) if (!RP[id].d[3] && !RP[id].d[9]) circ(ctx, mx + RP[id].x * s, my + RP[id].y * s, 2.5, RP[id].d[2]);
    circ(ctx, mx + me.x * s, my + me.y * s, 3, '#fff');
  }
  ctx.restore();
  ctx.fillStyle = '#c8b796'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${WORLD_NAME}　/　${st ? st.p.length : 1}人`, mx + mw / 2, my + mh + 15);

  // 巣の方向（地上）
  if (me.l === 's' && ms && !ms[9]) {
    const dx = D.NEST.x - me.x, dy = D.NEST.y - me.y;
    if (Math.abs(dx) * Z > VW / 2 || Math.abs(dy) * Z > VH / 2) {
      const a = Math.atan2(dy, dx), R = Math.min(VW, VH) * .42, ax = VW / 2 + Math.cos(a) * R, ay = VH / 2 + Math.sin(a) * R;
      ctx.save(); ctx.translate(ax, ay); ctx.rotate(a); ctx.fillStyle = 'rgba(255,220,120,.85)';
      ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-9, -10); ctx.lineTo(-4, 0); ctx.lineTo(-9, 10); ctx.fill(); ctx.restore();
      ctx.fillStyle = 'rgba(255,220,120,.9)'; ctx.font = 'bold 12px sans-serif'; ctx.fillText(`巣 ${Math.round(Math.hypot(dx, dy) / D.T)}m`, ax, ay - 16);
    }
  }

  // ホットバー
  const HL = hotbarLayout(), sz = HL.sz, gap = HL.gap, hx = HL.x, hy = HL.y;
  for (let i = 0; i < 8; i++) {
    const x = hx + i * (sz + gap), s = inv[i];
    ctx.fillStyle = 'rgba(20,14,8,.8)'; ctx.fillRect(x, hy, sz, sz);
    ctx.strokeStyle = i === sel ? '#f0d9a8' : '#4b3a24'; ctx.lineWidth = i === sel ? 3 : 2; ctx.strokeRect(x, hy, sz, sz);
    if (s) {
      drawIcon(ctx, s.id, x + sz / 2, hy + sz / 2, 40);
      if (s.n > 1) { ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'right'; ctx.fillStyle = '#000'; ctx.fillText(s.n, x + sz - 3, hy + sz - 3); ctx.fillStyle = '#fff'; ctx.fillText(s.n, x + sz - 4, hy + sz - 4); }
    }
    ctx.font = '10px sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#8f7d60'; ctx.fillText(i + 1, x + 3, hy + 11);
  }
  const cur = inv[sel];
  ctx.textAlign = 'center'; ctx.font = 'bold 14px sans-serif';
  if (cur) {
    const def = D.ITEMS[cur.id];
    const hint = def.food ? (touchMode ? `（「食べる」ボタンで +${def.food}）` : `（右クリック/E で食べる +${def.food}）`) : def.place ? (touchMode ? '（置きたい場所をタップ）' : '（右クリック/O で置く）') : def.jaw || def.armor ? '（持ち物画面で装備できる）' : '';
    ctx.fillStyle = '#000'; ctx.fillText(def.n + hint, VW / 2 + 1, hy - 9); ctx.fillStyle = '#f0d9a8'; ctx.fillText(def.n + hint, VW / 2, hy - 10);
  }
  // 状況ヒント
  let tip = '';
  if (ms && !ms[9]) {
    if (me.l === 's' && Math.hypot(me.x - D.NEST.x, me.y - D.NEST.y) < D.NEST.r + 30) tip = 'F：巣に入る';
    if (me.l === 'u' && Math.hypot(me.x - (D.UENT.tx + .5) * D.T, me.y - (D.UENT.ty + .5) * D.T) < D.T * 1.3) tip = 'F：地上に出る';
    const a = aim(), o = objs[me.l].get(Math.floor(a.y / D.T) * LW(me.l) + Math.floor(a.x / D.T));
    const R = touchMode ? 'タップ' : '右クリック', H = touchMode ? '長押し' : '左クリック長押し';
    const TIPS = { chest: `${R}：チェストを開く`, bench: `${R}：作業台でクラフト`, bed: `${R}：${st && st.c[2] ? '眠る' : '復活地点にする（夜は眠れる）'}`, sugarNode: `${H}：角砂糖を削る`, branch: `${H}：枝をかじって小枝を集める`, bigLeaf: `${H}：落ち葉をちぎって葉っぱを集める`, husk: `${H}：虫の亡骸から甲殻を取る` };
    if (o && Math.hypot(a.x - me.x, a.y - me.y) < D.REACH && TIPS[o.t]) tip = TIPS[o.t];
    if (me.l === 'u' && cracks.size) {
      for (const [i] of cracks) { const tx = i % D.UW, ty = (i / D.UW) | 0; if (Math.hypot((tx + .5) * D.T - me.x, (ty + .5) * D.T - me.y) < 200) { tip = '⚠ 天井が崩れそう！柱を置くか離れろ！'; break; } }
    }
  }
  if (tip) {
    ctx.font = 'bold 15px sans-serif'; const w = ctx.measureText(tip).width + 30;
    ctx.fillStyle = tip.startsWith('⚠') ? 'rgba(120,20,10,.75)' : 'rgba(0,0,0,.6)'; ctx.fillRect(VW / 2 - w / 2, hy - 62, w, 28);
    ctx.fillStyle = '#ffe9a8'; ctx.fillText(tip, VW / 2, hy - 43);
  }
  if (!touchMode) {
    ctx.textAlign = 'left'; ctx.font = '11px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillText('Tab 持ち物・装備　C クラフト　E 調べる・使う・食べる　K 掘る・攻撃　O 置く　F 出入り　Q 捨てる', 12, VH - 12);
  } else drawTouchUI();
  // 睡眠
  if (ms && ms[16]) {
    ctx.fillStyle = st.c[4] ? 'rgba(10,15,40,.45)' : 'rgba(10,15,40,.25)'; ctx.fillRect(0, 0, VW, VH);
    ctx.textAlign = 'center'; ctx.font = 'bold 22px sans-serif'; ctx.fillStyle = '#c8d4ff';
    ctx.fillText(st.c[4] ? '💤 全員が眠っている… 夜が早く過ぎていく' : '💤 眠っている…（仲間が全員眠ると夜が早く過ぎる）', VW / 2, VH / 2 - 60);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#aab'; ctx.fillText(touchMode ? 'スティックを動かすと起きる' : '移動キーで起きる', VW / 2, VH / 2 - 34);
  }

  // メッセージ
  ctx.textAlign = 'center'; ctx.font = 'bold 15px sans-serif';
  let yy = 112;
  for (let i = msgs.length - 1; i >= 0; i--) {
    const m = msgs[i]; m.life -= dt;
    if (m.life <= 0) { msgs.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, m.life);
    ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillText(m.t, VW / 2 + 1, yy + 1); ctx.fillStyle = '#fff'; ctx.fillText(m.t, VW / 2, yy);
    yy += 22;
  }
  ctx.globalAlpha = 1;
  // 死亡
  if (ms && ms[9]) {
    ctx.fillStyle = 'rgba(60,0,0,.5)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 40px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('やられた…', VW / 2, VH / 2 - 10);
    ctx.font = '18px sans-serif'; ctx.fillText(`${ms[10]}秒後に巣で復活　持ち物は倒れた場所に落ちている`, VW / 2, VH / 2 + 28);
  }
  if (gameover) {
    gameover.t -= dt;
    if (gameover.t <= 0) gameover = null;
    else {
      ctx.fillStyle = 'rgba(0,0,0,.8)'; ctx.fillRect(0, 0, VW, VH);
      ctx.textAlign = 'center'; ctx.fillStyle = '#ff7a5a'; ctx.font = 'bold 54px sans-serif'; ctx.fillText('全滅', VW / 2, VH / 2 - 30);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 24px sans-serif'; ctx.fillText(`${gameover.day}日目で力尽きた`, VW / 2, VH / 2 + 18);
      ctx.font = '16px sans-serif'; ctx.fillStyle = '#bbb'; ctx.fillText('ワールドは消滅した。まもなく新しいワールドで再スタート…', VW / 2, VH / 2 + 54);
    }
  }
}

function drawTouchUI() {
  // スティック
  const bx = joy ? joy.ox : 110, by = joy ? joy.oy : VH - 150;
  circ(ctx, bx, by, 55, joy ? 'rgba(255,255,255,.12)' : 'rgba(255,255,255,.06)');
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx, by, 55, 0, 7); ctx.stroke();
  if (joy) {
    const dx = joy.x - joy.ox, dy = joy.y - joy.oy, l = Math.hypot(dx, dy), k = l > 55 ? 55 / l : 1;
    circ(ctx, bx + dx * k, by + dy * k, 24, 'rgba(255,240,210,.55)');
  } else { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('移動', bx, by + 4); }
  // ボタン
  for (const b of touchButtons()) {
    const dim = b.id === 'enter' && !b.on;
    circ(ctx, b.x, b.y, b.r, dim ? 'rgba(30,22,14,.45)' : b.id === 'enter' ? 'rgba(200,150,60,.85)' : 'rgba(30,22,14,.8)');
    ctx.strokeStyle = dim ? 'rgba(255,255,255,.15)' : '#d7b77a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
    ctx.fillStyle = dim ? 'rgba(255,255,255,.3)' : '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(b.label, b.x, b.y + 4);
  }
  if (TT < 25) { ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('画面タップ：置く・開く・食べる　長押し：掘る・攻撃', VW / 2, VH - 220); }
}

// ================= パネル（持ち物・クラフト・チェスト） =================
function openPanel(kind) { panel = kind; held = -1; $('panel').classList.remove('hidden'); renderPanel(); }
function closePanel() { panel = null; chest = null; held = -1; $('panel').classList.add('hidden'); }
function slotHTML(s, attrs, cls) {
  return `<div class="slot ${cls || ''}" ${attrs} title="${s ? D.ITEMS[s.id].n : ''}">${s ? `<img src="${iconURL(s.id)}">${s.n > 1 ? `<span>${s.n}</span>` : ''}` : ''}</div>`;
}
function invGrid(kind) {
  let h = '<div class="grid">';
  for (let i = 0; i < D.INV_SIZE; i++) h += slotHTML(inv[i], `data-k="${kind}" data-i="${i}"`, (i === held ? 'held ' : '') + (i === sel ? 'sel' : ''));
  return h + '</div>';
}
function renderPanel() {
  if (!panel || !D) return;
  const body = $('pbody');
  if (panel === 'inv') {
    $('ptitle').innerHTML = '持ち物・装備 <small>Tab / Esc で閉じる</small>';
    const jl = equip.jaw ? D.ITEMS[equip.jaw.id].jaw : 1, J = D.JAW[jl], ar = equip.armor ? D.ITEMS[equip.armor.id].armor : 0;
    const hs = held >= 0 && inv[held], canEq = hs && (D.ITEMS[hs.id].jaw || D.ITEMS[hs.id].armor);
    body.innerHTML = `<div class="invwrap"><div class="eqbox"><h3 style="margin-top:0">装備</h3>
      <div class="eqrow">${slotHTML(equip.jaw, 'data-k="eq" data-e="jaw"', 'eq')}<div>大あご<br><b>${equip.jaw ? D.ITEMS[equip.jaw.id].n : 'ふつうの大あご'}</b></div></div>
      <div class="eqrow">${slotHTML(equip.armor, 'data-k="eq" data-e="armor"', 'eq')}<div>よろい<br><b>${equip.armor ? D.ITEMS[equip.armor.id].n : 'なし'}</b></div></div>
      <div class="stats">掘る速さ　${J.dig}<br>攻撃力　　${J.atk}<br>防御　　　${Math.round(ar * 100)}%</div></div>
      <div><h3 style="margin-top:0">持ち物（上の段がホットバー 1〜8）</h3>${invGrid('inv')}
      <div class="btns">${canEq ? '<button id="equipBtn" style="background:#3a7a3a;color:#fff">装備する</button>' : ''}${held >= 0 ? '<button id="dropBtn">捨てる</button>' : ''}</div></div></div>`;
    $('phint').textContent = 'つかむ → 別の枠で入れ替え ／ 大あご・よろいをつかんで装備欄をタップで装備 ／ 装備欄をタップで外す';
  } else if (panel === 'craft') {
    $('ptitle').innerHTML = 'クラフト <small>C / Esc で閉じる</small>';
    const near = nearBenchC();
    let h = '<div class="recipes">';
    D.RECIPES.forEach((r, ri) => {
      let ok = !r.bench || near, cost = '';
      for (const id in r.cost) {
        const have = inv.reduce((a, s) => a + (s && s.id === id ? s.n : 0), 0);
        if (have < r.cost[id]) ok = false;
        cost += `<span class="${have < r.cost[id] ? 'ng' : ''}"><img src="${iconURL(id)}"> ${D.ITEMS[id].n} ${have}/${r.cost[id]}</span>`;
      }
      h += `<div class="rc"><img src="${iconURL(r.out)}"><div class="nm">${D.ITEMS[r.out].n}${r.n > 1 ? ' ×' + r.n : ''}${r.bench ? `<small>${near ? '作業台 ✓' : '作業台の近くで'}</small>` : ''}</div><div class="cost">${cost}</div><button data-craft="${ri}" ${ok ? '' : 'disabled'}>作る</button></div>`;
    });
    body.innerHTML = h + '</div>';
    $('phint').textContent = '大あご・よろいは作ると自動で装備（装備中なら持ち物へ）。柱は崩落を防ぐ（土の柱：半径3マス、根っこの柱：半径5マス）';
  } else if (panel === 'chest' && chest) {
    $('ptitle').innerHTML = 'チェスト <small>Esc で閉じる</small>';
    let h = '<div class="grid">';
    for (let i = 0; i < D.CHEST_SIZE; i++) h += slotHTML(chest.items[i], `data-k="chest" data-i="${i}"`);
    body.innerHTML = h + '</div><h3>持ち物</h3>' + invGrid('cinv');
    $('phint').textContent = 'クリックでチェスト ⇄ 持ち物 に移動（仲間と共有）';
  }
}
function nearBenchC() {
  for (const [i, o] of objs[me.l]) {
    if (o.t !== 'bench') continue;
    const W = LW(me.l);
    if (Math.hypot((i % W + .5) * D.T - me.x, ((i / W | 0) + .5) * D.T - me.y) < D.T * 3.5) return true;
  }
  return false;
}
$('pbody').addEventListener('click', e => {
  if (e.target.id === 'dropBtn') { socket.emit('drop', held); held = -1; renderPanel(); return; }
  if (e.target.id === 'equipBtn') { socket.emit('equip', { slot: held }); held = -1; return; }
  const b = e.target.closest('[data-craft]');
  if (b) { socket.emit('craft', +b.dataset.craft); return; }
  const s = e.target.closest('.slot');
  if (!s) return;
  const k = s.dataset.k, i = +s.dataset.i;
  if (k === 'eq') {
    if (held >= 0) { socket.emit('equip', { slot: held }); held = -1; }
    else socket.emit('equip', { unequip: s.dataset.e });
    return;
  }
  if (k === 'inv') {
    if (held < 0) { if (inv[i]) held = i; }
    else { socket.emit('swap', { a: held, b: i }); held = -1; }
    renderPanel();
  } else if (k === 'cinv') socket.emit('chestMove', { from: 'inv', slot: i });
  else if (k === 'chest') socket.emit('chestMove', { from: 'chest', slot: i });
});
$('pbody').addEventListener('contextmenu', e => {
  e.preventDefault();
  const s = e.target.closest('.slot');
  if (s && s.dataset.k === 'inv') socket.emit('drop', +s.dataset.i);
});
setInterval(() => { if (panel === 'craft') renderPanel(); }, 1000);   // 作業台との距離を反映
</script>
</body>
