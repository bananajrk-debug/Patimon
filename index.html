<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANT SURVIVAL</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0e0a06; font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif; color: #eee; user-select: none; }
  canvas { display: block; }
  .hidden { display: none !important; }
  #lobby {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #3b2a17 0%, #120c07 70%);
  }
  #lobby .box { width: 420px; text-align: center; }
  #lobby h1 { font-size: 58px; letter-spacing: 8px; color: #f0d9a8; text-shadow: 0 4px 0 #000, 0 0 30px rgba(240,200,120,.25); }
  #lobby .sub { color: #b9a685; margin: 6px 0 34px; letter-spacing: 2px; }
  #lobby input {
    width: 100%; font-size: 20px; padding: 11px 14px; border-radius: 6px; border: 2px solid #6b5636; background: #1d140b; color: #fff;
    text-align: center; outline: none; margin-bottom: 12px; font-family: inherit;
  }
  #lobby input:focus { border-color: #e2b45c; }
  #lobby button {
    width: 100%; font-size: 19px; padding: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-family: inherit;
    background: #d79b3b; color: #1d140b; box-shadow: 0 4px 0 #7a5418; margin-bottom: 12px;
  }
  #lobby button.sec { background: #4b3a24; color: #f0d9a8; box-shadow: 0 4px 0 #24190d; }
  #lobby button:active { transform: translateY(3px); box-shadow: none; }
  #lobby .row { display: flex; gap: 10px; } #lobby .row > * { flex: 1; }
  #lobby .or { color: #7d6a4c; margin: 6px 0 14px; font-size: 13px; }
  #err { color: #ff8a7a; min-height: 22px; margin-top: 4px; }
  #lobby .keys { margin-top: 26px; font-size: 13px; line-height: 1.9; color: #a08f72; }

  #panel {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -54%); z-index: 10;
    background: rgba(24,17,10,.96); border: 2px solid #6b5636; border-radius: 8px; padding: 16px 18px; min-width: 470px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  #panel h2 { font-size: 17px; color: #f0d9a8; margin-bottom: 10px; display: flex; justify-content: space-between; }
  #panel h2 small { color: #8f7d60; font-weight: normal; font-size: 12px; }
  #panel h3 { font-size: 13px; color: #b9a685; margin: 10px 0 6px; font-weight: normal; }
  .grid { display: grid; grid-template-columns: repeat(8, 52px); gap: 5px; }
  .slot {
    width: 52px; height: 52px; background: #2b2014; border: 2px solid #4b3a24; border-radius: 5px; position: relative; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .slot:hover { border-color: #b08a4e; }
  .slot.sel { border-color: #f0d9a8; }
  .slot.held { border-color: #6fd36f; background: #2e3a20; }
  .slot img { width: 40px; height: 40px; pointer-events: none; }
  .slot span { position: absolute; right: 3px; bottom: 1px; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; }
  .recipes { max-height: 62vh; overflow-y: auto; padding-right: 4px; }
  .rc { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; background: #22180e; margin-bottom: 5px; }
  .rc img { width: 36px; height: 36px; }
  .rc .nm { width: 130px; font-size: 14px; }
  .rc .nm small { display: block; color: #e2a35c; font-size: 11px; }
  .rc .cost { flex: 1; font-size: 12px; color: #c8b796; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .rc .cost .ng { color: #d36b5c; }
  .rc .cost img { width: 18px; height: 18px; vertical-align: middle; }
  .rc button { padding: 6px 14px; border: none; border-radius: 4px; background: #d79b3b; color: #1d140b; font-weight: bold; cursor: pointer; font-family: inherit; }
  .rc button:disabled { background: #4b3a24; color: #7d6a4c; cursor: default; }
  .phint { margin-top: 10px; font-size: 12px; color: #8f7d60; }
</style>
</head>
<body>
<div id="lobby">
  <div class="box">
    <h1>ANT SURVIVAL</h1>
    <div class="sub">掘れ。運べ。夜を越えろ。</div>
    <input id="nameIn" maxlength="10" placeholder="名前">
    <button id="createBtn">新しいワールドを作る</button>
    <div class="or">― または部屋番号で参加 ―</div>
    <div class="row">
      <input id="codeIn" maxlength="5" placeholder="5桁の部屋番号" inputmode="numeric">
      <button id="joinBtn" class="sec" style="height:50px">参加</button>
    </div>
    <div id="err"></div>
    <div class="keys">
      WASD 移動 ／ 左クリック長押し 掘る・攻撃・壊す ／ 右クリック 置く・使う・開く<br>
      1〜8・ホイール 持ち替え ／ Tab 持ち物 ／ C クラフト ／ E 食べる ／ F 巣に出入り ／ Q 捨てる
    </div>
  </div>
</div>
<canvas id="c"></canvas>
<div id="panel" class="hidden"><h2 id="ptitle"></h2><div id="pbody"></div><div class="phint" id="phint"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
'use strict';
const socket = io();
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const dark = document.createElement('canvas'), dctx = dark.getContext('2d');
const Z = 2;   // 表示倍率
let VW = 0, VH = 0;
function resize() { VW = cv.width = dark.width = innerWidth; VH = cv.height = dark.height = innerHeight; }
addEventListener('resize', resize); resize();

// ================= 状態 =================
let D = null, MEID = null, CODE = '';
const me = { l: 'u', x: 0, y: 0, a: 0, s: 1, phase: 0 };
let inv = [], sel = 0, under = null, rocks = [], dens = [];
const objs = { s: new Map(), u: new Map() }, items = new Map();
let grass = new Map(), st = null, cracks = new Map();
const RP = {}, RE = {};
const msgs = [], parts = [];
let gameover = null, panel = null, chest = null, held = -1, shake = 0;
const mouse = { x: 0, y: 0, l: false };
const keys = {};
const mm = document.createElement('canvas'); let mmDirty = true;

// ================= ロビー =================
const $ = id => document.getElementById(id);
$('nameIn').value = localStorage.getItem('antName') || '';
function join(create) {
  const name = $('nameIn').value.trim() || 'アリ';
  try { localStorage.setItem('antName', name); } catch (e) {}
  $('err').textContent = '接続中…';
  socket.emit('join', { name, create, code: $('codeIn').value.trim() });
}
$('createBtn').onclick = () => join(true);
$('joinBtn').onclick = () => join(false);
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') join(false); });
socket.on('err', t => $('err').textContent = t);

// ================= 受信 =================
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
socket.on('world', d => {
  D = d.defs; MEID = d.me; CODE = d.code;
  rocks = d.rocks; dens = d.dens; grass = new Map(d.grass); under = b64(d.under);
  objs.s = new Map(d.objs.s.map(([i, t, hp]) => [i, { t, hp }]));
  objs.u = new Map(d.objs.u.map(([i, t, hp]) => [i, { t, hp }]));
  items.clear(); for (const it of d.items) addItemC(it);
  Object.assign(me, { l: d.you.l, x: d.you.x, y: d.you.y, s: d.you.s });
  inv = d.inv; sel = d.sel; mmDirty = true; gameover = null; closePanel();
  $('lobby').classList.add('hidden');
  for (const k in RP) delete RP[k];
  for (const k in RE) delete RE[k];
});
function addItemC(a) { items.set(a[0], { id: a[0], l: a[1] ? 'u' : 's', x: a[2], y: a[3], item: a[4], n: a[5] }); }
socket.on('item+', addItemC);
socket.on('item-', id => items.delete(id));
socket.on('tp', d => { Object.assign(me, { s: d.s, l: d.l, x: d.x, y: d.y }); if (panel === 'chest') closePanel(); });
socket.on('inv', d => { inv = d.inv; sel = d.sel; if (panel) renderPanel(); });
socket.on('tiles', list => { for (const [i, v] of list) under[i] = v; mmDirty = true; });
socket.on('grass', list => { for (const [i, g] of list) grass.set(i, g); });
socket.on('objs', list => { for (const { l, i, o } of list) { if (o) objs[l].set(i, o); else objs[l].delete(i); } mmDirty = true; });
socket.on('chest', d => {
  if (d.update && !(panel === 'chest' && chest && chest.l === d.l && chest.i === d.i)) return;
  chest = d; openPanel('chest');
});
socket.on('openCraft', () => openPanel('craft'));
socket.on('msg', t => { msgs.push({ t, life: 6 }); if (msgs.length > 6) msgs.shift(); });
socket.on('gameover', d => gameover = { day: d.day, t: 7 });
socket.on('collapse', list => {
  for (const i of list) {
    const tx = i % D.UW, ty = (i / D.UW) | 0;
    for (let k = 0; k < 10; k++) parts.push({ l: 'u', x: (tx + Math.random()) * D.T, y: (ty + Math.random()) * D.T, vx: (Math.random() - .5) * 80, vy: (Math.random() - .5) * 80, life: .8, col: '120,95,70', r: 2 + Math.random() * 3 });
    if (me.l === 'u' && Math.hypot((tx + .5) * D.T - me.x, (ty + .5) * D.T - me.y) < 400) shake = 0.5;
  }
});
socket.on('st', s => {
  st = s;
  cracks = new Map(s.k);
  sync(RP, s.p.filter(p => p[0] !== MEID).map(p => ({ id: p[0], x: p[4], y: p[5], a: p[6], d: p })));
  sync(RE, s.e.map(e => ({ id: e[0], x: e[3], y: e[4], a: e[5], d: e })));
});
function sync(store, list) {
  const seen = {};
  for (const o of list) {
    seen[o.id] = 1;
    let r = store[o.id];
    if (!r || r.d[2] !== o.d[2] && store === RE || store === RP && r.d[3] !== o.d[3]) r = store[o.id] = { x: o.x, y: o.y, a: o.a, phase: 0 };
    r.tx = o.x; r.ty = o.y; r.ta = o.a; r.d = o.d;
  }
  for (const id in store) if (!seen[id]) delete store[id];
}
const myState = () => st && st.p.find(p => p[0] === MEID);

// ================= 入力 =================
const inGame = () => D && $('lobby').classList.contains('hidden');
addEventListener('keydown', e => {
  if (!inGame()) return;
  keys[e.code] = true;
  if (e.code === 'Tab') { e.preventDefault(); panel === 'inv' ? closePanel() : openPanel('inv'); }
  if (e.code === 'KeyC') panel === 'craft' ? closePanel() : openPanel('craft');
  if (e.code === 'Escape') closePanel();
  if (e.code === 'KeyE') socket.emit('eat');
  if (e.code === 'KeyF') socket.emit('enter');
  if (e.code === 'KeyQ') socket.emit('drop', sel);
  if (/^Digit[1-8]$/.test(e.code)) setSel(+e.code.slice(5) - 1);
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.l = false; });
cv.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
cv.addEventListener('mousedown', e => {
  if (!inGame()) return;
  if (e.button === 0) mouse.l = true;
  if (e.button === 2) { const a = aim(); socket.emit('use', { x: a.x, y: a.y }); }
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (inGame()) setSel((sel + (e.deltaY > 0 ? 1 : 7)) % 8); }, { passive: true });
function setSel(i) { sel = i; socket.emit('sel', i); }
const aim = () => ({ x: me.x + (mouse.x - VW / 2) / Z, y: me.y + (mouse.y - VH / 2) / Z });

// ================= 衝突（サーバーと同じ） =================
const LW = l => l === 'u' ? D.UW : D.SW, LH = l => l === 'u' ? D.UH : D.SH;
const isNatSolid = v => v >= 1 && v <= 6;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function solidAt(l, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= LW(l) || ty >= LH(l)) return true;
  const i = ty * LW(l) + tx;
  if (l === 'u' && isNatSolid(under[i])) return true;
  const o = objs[l].get(i);
  return !!(o && D.OBJ[o.t].solid);
}
function collide(l, e, r) {
  const T = D.T;
  if (l === 's') for (const o of rocks) {
    const dx = e.x - o.x, dy = e.y - o.y, min = o.r + r;
    if (Math.abs(dx) < min && Math.abs(dy) < min) { const d = Math.hypot(dx, dy); if (d < min && d > 0.001) { e.x = o.x + dx / d * min; e.y = o.y + dy / d * min; } }
  }
  for (let pass = 0; pass < 2; pass++) {
    const tx0 = Math.floor((e.x - r) / T), tx1 = Math.floor((e.x + r) / T), ty0 = Math.floor((e.y - r) / T), ty1 = Math.floor((e.y + r) / T);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      if (!solidAt(l, tx, ty)) continue;
      const cx = clamp(e.x, tx * T, tx * T + T), cy = clamp(e.y, ty * T, ty * T + T);
      const dx = e.x - cx, dy = e.y - cy, d = Math.hypot(dx, dy);
      if (d >= r) continue;
      if (d < 0.001) { const mx = e.x - (tx + .5) * T, my = e.y - (ty + .5) * T; if (Math.abs(mx) > Math.abs(my)) e.x = mx > 0 ? tx * T + T + r : tx * T - r; else e.y = my > 0 ? ty * T + T + r : ty * T - r; }
      else { e.x = cx + dx / d * r; e.y = cy + dy / d * r; }
    }
  }
  e.x = clamp(e.x, r, LW(l) * T - r); e.y = clamp(e.y, r, LH(l) * T - r);
}

// ================= アイコン =================
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function circ(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function ell(g, x, y, rx, ry, rot, c) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, 7); g.fill(); }
function ln(g, pts, c, w) { g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); }
const ICON = {
  crumb: g => { ell(g, 0, 1, 12, 9, .3, '#d9b77a'); ell(g, -2, -2, 8, 5, .3, '#e8cc95'); circ(g, -4, 2, 2, '#b58d4f'); circ(g, 4, -1, 1.6, '#b58d4f'); },
  seed: g => { ell(g, 0, 0, 7, 12, .5, '#4b3a1c'); ell(g, -2, -3, 2.5, 6, .5, '#7d6236'); },
  sugar: g => { g.fillStyle = '#d9d9cf'; g.fillRect(-11, -7, 22, 18); g.fillStyle = '#fbfbf4'; g.fillRect(-11, -12, 22, 8); g.fillStyle = '#ececE2'; g.fillRect(-11, -4, 22, 2); circ(g, -5, -9, 1.2, '#fff'); circ(g, 4, -8, 1, '#fff'); },
  fruit: g => { g.fillStyle = '#d6303a'; g.beginPath(); g.moveTo(-12, -8); g.quadraticCurveTo(0, -14, 12, -8); g.lineTo(0, 13); g.closePath(); g.fill(); for (const [x, y] of [[-5, -5], [3, -6], [-1, 1], [4, -1], [-3, 6]]) circ(g, x, y, 1.1, '#ffe08a'); ell(g, 0, -10, 6, 2.5, 0, '#3f8a2e'); },
  meat: g => { ell(g, 0, 0, 12, 9, -.3, '#7a2e1e'); ell(g, -2, -2, 7, 4, -.3, '#a5503a'); ell(g, 4, 2, 3, 2, 0, '#e8b0a0'); },
  grass: g => { ln(g, [[-6, 12], [-8, -2], [-10, -12]], '#4f8a2b', 3); ln(g, [[0, 12], [0, -3], [2, -14]], '#63a535', 3.5); ln(g, [[6, 12], [8, 0], [11, -9]], '#4f8a2b', 3); },
  leaf: g => { ell(g, 0, 0, 13, 7, -.6, '#4f9a33'); ln(g, [[-10, 8], [9, -7]], '#2f6a1f', 1.6); ln(g, [[-10, 8], [-14, 12]], '#3a2a14', 2); },
  twig: g => { ln(g, [[-12, 10], [11, -10]], '#7a5530', 4); ln(g, [[1, 1], [8, 4]], '#7a5530', 2.5); ln(g, [[-12, 10], [11, -10]], 'rgba(255,255,255,.15)', 1); },
  pebble: g => { ell(g, 0, 2, 12, 9, .2, '#8a867c'); ell(g, -3, -1, 6, 4, .2, '#b4b0a5'); },
  needle: g => { ln(g, [[0, 12], [-9, -12]], '#2f5a2a', 2.5); ln(g, [[0, 12], [8, -12]], '#3a6a33', 2.5); circ(g, 0, 12, 2.5, '#5a4022'); },
  dirt: g => { ell(g, 0, 4, 13, 8, 0, '#6b4a2b'); ell(g, -2, 0, 9, 6, 0, '#7d5733'); circ(g, 4, 2, 1.5, '#4b331d'); circ(g, -5, 4, 1.2, '#4b331d'); },
  clay: g => { g.fillStyle = '#a4643a'; g.beginPath(); g.roundRect(-12, -9, 24, 18, 5); g.fill(); ell(g, -4, -4, 6, 2.5, 0, '#c47f4f'); },
  root: g => { ln(g, [[-12, -10], [-4, -2], [-6, 6], [4, 10], [12, 6]], '#5a3a1e', 4.5); ln(g, [[-4, -2], [6, -8]], '#5a3a1e', 2.5); },
  glow: g => { const gr = g.createRadialGradient(0, -2, 1, 0, -2, 16); gr.addColorStop(0, 'rgba(120,255,230,.6)'); gr.addColorStop(1, 'rgba(120,255,230,0)'); g.fillStyle = gr; g.fillRect(-16, -16, 32, 32); g.fillStyle = '#e8e0c8'; g.fillRect(-2, -1, 4, 11); ell(g, 0, -3, 10, 6, 0, '#5ef0d0'); circ(g, -3, -5, 1.5, '#c8fff4'); },
  silk: g => { g.strokeStyle = '#f2f2f2'; g.lineWidth = 2; g.beginPath(); for (let k = 0; k < 30; k++) { const a = k * .5, r = 2 + k * .35; g.lineTo(Math.cos(a) * r, Math.sin(a) * r); } g.stroke(); },
  shell: g => { ell(g, 0, 2, 12, 10, 0, '#1f3a22'); ell(g, -3, -2, 6, 3, -.3, '#4f7a4a'); ln(g, [[0, -8], [0, 12]], '#0b140c', 1.5); },
  chest: g => { g.fillStyle = '#7a5226'; g.fillRect(-13, -9, 26, 20); g.fillStyle = '#946535'; g.fillRect(-13, -11, 26, 8); g.fillStyle = '#4a3014'; g.fillRect(-13, -3, 26, 2); g.fillStyle = '#e2b45c'; g.fillRect(-2, -5, 4, 6); },
  bench: g => { g.fillStyle = '#5a3d1e'; g.fillRect(-12, 2, 3, 11); g.fillRect(9, 2, 3, 11); g.fillStyle = '#946535'; g.fillRect(-14, -6, 28, 9); g.fillStyle = '#b07a42'; g.fillRect(-14, -6, 28, 3); ell(g, -5, -9, 5, 2.5, -.3, '#4f9a33'); ln(g, [[3, -9], [11, -12]], '#8a867c', 2.5); },
  barricade: g => { ell(g, 0, 5, 14, 8, 0, '#6b4a2b'); ell(g, 0, 2, 10, 5, 0, '#7d5733'); ln(g, [[-12, 8], [8, -12]], '#7a5530', 3); ln(g, [[12, 8], [-8, -12]], '#7a5530', 3); },
  clayWall: g => { g.fillStyle = '#8a5230'; g.fillRect(-14, -12, 28, 24); g.fillStyle = '#b06e40'; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) g.fillRect(-13 + c * 9 + (r % 2) * 4 - (r % 2 && c === 2 ? 4 : 0), -11 + r * 8, 8 - (r % 2 && c === 2 ? 0 : 0), 6); },
  pillarD: g => { ell(g, 0, 8, 11, 5, 0, '#4b331d'); g.fillStyle = '#7d5733'; g.fillRect(-9, -10, 18, 18); ell(g, 0, -10, 9, 4, 0, '#9a7045'); ln(g, [[-9, -2], [9, -2]], '#5a3d22', 1.5); ln(g, [[-9, 4], [9, 4]], '#5a3d22', 1.5); },
  pillarR: g => { ell(g, 0, 8, 11, 5, 0, '#3a2412'); g.fillStyle = '#5a3a1e'; g.fillRect(-9, -10, 18, 18); ell(g, 0, -10, 9, 4, 0, '#7a5530'); ln(g, [[-6, -10], [-2, 0], [-7, 8]], '#3a2412', 2); ln(g, [[5, -10], [2, 2], [6, 8]], '#3a2412', 2); },
  lamp: g => { const gr = g.createRadialGradient(0, -2, 1, 0, -2, 16); gr.addColorStop(0, 'rgba(255,240,150,.7)'); gr.addColorStop(1, 'rgba(255,240,150,0)'); g.fillStyle = gr; g.fillRect(-16, -16, 32, 32); g.fillStyle = '#d9cfb0'; g.fillRect(-2.5, -1, 5, 12); ell(g, 0, -3, 11, 7, 0, '#ffe27a'); ell(g, -3, -6, 4, 2, 0, '#fff6c8'); },
  spike: g => { for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; ln(g, [[0, 0], [Math.cos(a) * 13, Math.sin(a) * 13]], '#2f5a2a', 2.5); } circ(g, 0, 0, 3, '#5a4022'); },

function lighting(camX, camY, tx0, ty0, tx1, ty1) {
  if (!st) return;
  const [day, time, night, rain] = st.c;
  let a = 0;
  if (me.l === 'u') a = .9;
  else {
    if (night) a = .74;
    else if (time > D.DAY_LEN - 20) a = (time - (D.DAY_LEN - 20)) / 20 * .74;
    else if (time < 10 && day > 1) a = (1 - time / 10) * .74;
    if (rain) a = Math.max(a, .3);
  }
  if (a < .01) return;
  dctx.globalCompositeOperation = 'source-over'; dctx.clearRect(0, 0, VW, VH);
  dctx.fillStyle = me.l === 'u' ? `rgba(4,2,0,${a})` : `rgba(5,5,25,${a})`; dctx.fillRect(0, 0, VW, VH);
  dctx.globalCompositeOperation = 'destination-out';
  const toS = (x, y) => [(x - camX) * Z + VW / 2, (y - camY) * Z + VH / 2];
  const light = (x, y, r, k = 1) => {
    const [sx, sy] = toS(x, y), R = r * Z;
    if (sx < -R || sy < -R || sx > VW + R || sy > VH + R) return;
    const g = dctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    g.addColorStop(0, `rgba(0,0,0,${k})`); g.addColorStop(.5, `rgba(0,0,0,${k * .7})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(sx, sy, R, 0, 7); dctx.fill();
  };
  const ms = myState();
  if (ms && !ms[9]) light(me.x, me.y, me.l === 'u' ? 130 : 150);
  for (const id in RP) { const p = RP[id]; if (!p.d[9] && (p.d[3] ? 'u' : 's') === me.l) light(p.x, p.y, 100, .8); }
  for (const [i, o] of objs[me.l]) if (o.t === 'lamp') { const W = LW(me.l); light((i % W + .5) * D.T, ((i / W | 0) + .5) * D.T, 190); }
  if (me.l === 'u') {
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (under[ty * D.UW + tx] === 4) light((tx + .5) * D.T, (ty + .5) * D.T, 55, .7);
    if (!night) light((D.UENT.tx + .5) * D.T, (D.UENT.ty + .5) * D.T, 90, .8);
  } else light(D.NEST.x, D.NEST.y, 70, .6);
  ctx.drawImage(dark, 0, 0);
}

function drawHUD(dt, ms) {

  if (ms) {

// ================= パネル（持ち物・クラフト・チェスト） =================

        if (have < r.cost[id]) ok = false;

      }

    });
    body.innerHTML = h + '</div>';
    $('phint').textContent = '大あご・防具は持っているだけで効果あり。柱は崩落を防ぐ（土の柱：半径3マス、根っこの柱：半径5マス）';

function nearBenchC() {

    const W = LW(me.l);
    if (Math.hypot((i % W + .5) * D.T - me.x, ((i / W | 0) + .5) * D.T - me.y) < D.T * 3.5) return true;

    else { socket.emit('swap', { a: held, b: i }); held = -1; }
    renderPanel();
  } else if (k === 'cinv') socket.emit('chestMove', { from: 'inv', slot: i });
  else if (k === 'chest') socket.emit('chestMove', { from: 'chest', slot: i });
});
$('pbody').addEventListener('contextmenu', e => {
  e.preventDefault();
  const s = e.target.closest('.slot');
  if (s && s.dataset.k === 'inv') socket.emit('drop', +s.dataset.i);
});
setInterval(() => { if (panel === 'craft') renderPanel(); }, 1000);   // 作業台との距離を反映
</script>
</body>
</html>
